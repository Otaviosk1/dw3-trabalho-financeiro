{% extends "layout.html" %}
{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Cabecalho da Pagina -->
<header class="page-header">
  <p class="page-kicker text-primary fw-semibold mb-2">Cadastro</p>
  <h1 class="h3 fw-bold mb-2" id="formTitle">Cliente</h1>
  <p class="text-secondary mb-0">Preencha os campos abaixo para gerir os dados do cliente.</p>
</header>

<!-- Formulario de Cadastro e Edicao -->
<div class="card page-card border-0 shadow-sm">
  <div class="card-body p-4">
    <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="frmCliente" data-servidor-dw3="{{ servidorDw3 }}" data-token="{{ token }}">
      <input type="hidden" id="clienteid" name="clienteid">

      <div class="mb-3">
        <label for="codigo" class="form-label fw-semibold">Código</label>
        <input type="text" class="form-control" id="codigo" name="codigo" required>
      </div>

      <div class="mb-3">
        <label for="nome" class="form-label fw-semibold">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
      </div>

      <div class="mb-3">
        <label for="endereco" class="form-label fw-semibold">Endereço</label>
        <input type="text" class="form-control" id="endereco" name="endereco">
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="ativo" name="ativo" checked>
        <label class="form-check-label fw-semibold" for="ativo">Ativo</label>
      </div>

      <div class="d-flex gap-2 justify-content-end mt-4">
        <a href="/clientes" class="btn btn-secondary">Voltar</a>
        <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Scripts de Integracao -->
<script src="/js/dw3frontend.js"></script>
<script src="/apps/clientes/vwFormClientes.js"></script>
{% endblock %}
