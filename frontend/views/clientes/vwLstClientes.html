{% extends "layout.html" %}
{% block content %}
<link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Cabecalho da Pagina -->
<header class="page-header">
  <p class="page-kicker text-primary fw-semibold mb-2">Cadastro</p>
  <h1 class="h3 fw-bold mb-2">Clientes</h1>
  <p class="text-secondary mb-0">Consulte os clientes cadastrados no sistema financeiro.</p>
</header>

<!-- Listagem e Tabela de Clientes -->
<div class="card page-card border-0 shadow-sm">
  <div class="card-body p-4">
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-md-between gap-3 mb-4">
      <div>
        <h2 class="h5 fw-semibold mb-1">Lista de clientes</h2>
        <p class="text-secondary mb-0">Clientes retornados pelo servidor backend.</p>
      </div>
      <a class="btn btn-primary" href="/clientes/form?oper=Cr" id="btnNovoCliente">Incluir novo cliente</a>
    </div>

    <!-- Alertas de Erro -->
    <div id="clientesAlert" class="alert alert-danger d-none" role="alert"></div>

    <!-- Container com parametros para requisicoes na API -->
    <div id="clientesListagem" data-servidor-dw3="{{ servidorDw3 }}" data-token="{{ token }}">
      <div class="table-responsive">
        <table id="tblClientes" class="table table-striped table-hover align-middle w-100">
          <thead>
            <tr>
              <th>ID</th>
              <th>Código</th>
              <th>Nome</th>
              <th>Endereço</th>
              <th>Ativo</th>
              <th>Operações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Scripts e Dependencias do DataTables -->
<script src="/js/dw3frontend.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.js"></script>
<script src="/apps/clientes/vwLstClientes.js"></script>
{% endblock %}
