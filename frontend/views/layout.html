<!DOCTYPE html>
<html lang="pt">
<head>
  <!-- Metadados do documento -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>

  <!-- Estilos do Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- Barra de navegacao exibida condicionalmente -->
  {% if showNavbar %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <!-- Nome/Marca do sistema -->
      <a class="navbar-brand" href="/">Sistema Financeiro</a>

      <div class="collapse navbar-collapse">
        <!-- Links de navegacao com marcacao de pagina ativa -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link {% if activeMenu == 'clientes' %}active{% endif %}" href="/clientes">Clientes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if activeMenu == 'contas_receber' %}active{% endif %}" href="/contas_receber">Contas a Receber</a>
          </li>
        </ul>
        <!-- Acao para encerrar a sessao do usuario -->
        <button class="btn btn-outline-light btn-sm" onclick="dw3Logout()">Sair</button>
      </div>
    </div>
  </nav>
  {% endif %}

  <!-- Conteudo principal da aplicacao -->
  <main class="container">
    <!-- Token de autenticacao repassado para consumo nos scripts -->
    <input type="hidden" id="token" value="{{ token }}">
    
    <!-- Espaco reservado para insercao das views filhas -->
    {% block content %}{% endblock %}
  </main>

  <!-- Scripts do Bootstrap e funcoes utilitarias do frontend -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/dw3frontend.js"></script>
</body>
</html>
